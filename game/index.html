<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Emberlanes — a duel of embers in three lanes</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070d; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #game {
    width: min(100vw, 177.78vh);
    aspect-ratio: 16 / 9;
    display: block;
    background: #0a1420;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.8);
    touch-action: none;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Emberlanes: a three-lane card duel. Click a card in your hand, then click a lane to summon it. Click STRIKE or press Enter to attack. Keys 1 to 9 select a card, Q W E choose a lane, M mutes."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
